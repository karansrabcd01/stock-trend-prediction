# Render Blueprint for Stock Trend Prediction AI
# This file configures deployment for the backend API on Render.com
# Frontend will be deployed separately as a Static Site

services:
  # Backend API Service
  - type: web
    name: stock-trend-api
    env: python
    region: oregon
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "*"
    healthCheckPath: /api/health
